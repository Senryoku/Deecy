app-id: io.github.Senryoku.Deecy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Deecy

finish-args:
  - --filesystem=host:ro

  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  
  - --device=input 
  - --device=usb
  
  - --socket=pulseaudio

modules:
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp zig /app/bin/zig
      - cp -r lib /app/
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

  - name: deecy
    buildsystem: simple
    build-options: { build-args: ["--share=network"] } # Allow fetching dependencies
    build-commands:
      - /app/bin/zig build --release=fast -Dcpu=baseline -Dflatpak=true -p /app
    sources:
      - type: dir
        path: ../